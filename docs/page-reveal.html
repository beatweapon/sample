<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>HEXIM — 第七世界の年代記</title>
<style>
:root{--paper:#f0e5cf;--ink:#473523;--gold:#a88d65}*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:#e8dcc4;font-family:Georgia,"Yu Mincho","Hiragino Mincho ProN",serif}
button,select{font:inherit}button{cursor:pointer}a{color:#86532d;text-underline-offset:3px}
header{position:relative;z-index:50;min-height:54px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:9px;background:#eee3cd;border-bottom:1px solid #a48b664f;padding:9px clamp(12px,3vw,38px)}
.logo{font-size:21px;letter-spacing:.2em;color:#654626}.nav{display:flex;gap:4px;flex-wrap:wrap}.nav a{font:10px system-ui,sans-serif;text-decoration:none;padding:7px 8px;border:1px solid #bcaa8a}.nav a[aria-current]{background:#654626;color:#fff}
.kicker{font:10px system-ui,sans-serif;letter-spacing:.25em;color:#95754f}
.intro{text-align:center;padding:18px 14px 12px}.intro h1{font-size:clamp(22px,3vw,34px);font-weight:normal;letter-spacing:.14em;margin:5px 0}.intro p{font-size:11px;color:#826e59;margin:0}
#viewport{position:relative;max-width:1360px;margin:0 auto;width:100%;height:clamp(460px,68vh,690px);perspective:1700px;transform-style:preserve-3d;isolation:isolate;background:linear-gradient(90deg,#e7d5b3 0%,#f0e6d2 48%,#d4b88b 50%,#f0e6d2 52%,#e7d5b3 100%);overflow:visible}
#viewport:before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;box-shadow:inset 0 0 75px #70522a23}
#left-base{position:absolute;left:0;top:0;width:50%;height:100%;z-index:1;overflow:hidden}
#right-base{position:absolute;left:50%;top:0;width:50%;height:100%;z-index:1;overflow:hidden}
.page{width:100%;height:100%;position:relative;background:linear-gradient(90deg,#e3cda9 0,#f1e6d0 5%,#f3e9d6 89%,#e0cda8 100%);border:1px solid #bfa782;overflow:hidden}
.page.left{background:linear-gradient(90deg,#dcc49e,#f3e9d6 11%,#f2e6cf 91%,#c3aa81)}
.page.right{background:linear-gradient(90deg,#cdb18a,#f2e5cf 9%,#f2e7d2 92%,#dfc9a7)}
.page:before{content:"";position:absolute;inset:13px;border:1px solid #bba47d88;pointer-events:none}
.page-inner{padding:clamp(24px,4.1vw,57px) clamp(21px,5.5vw,70px) clamp(21px,3.2vw,45px);height:100%;display:flex;flex-direction:column}
.page-heading{font:10px system-ui,sans-serif;letter-spacing:.19em;color:#8b6e49;border-bottom:1px solid #bfa985;padding-bottom:13px}
.page h2{font-weight:normal;font-size:clamp(19px,2.7vw,33px);letter-spacing:.11em;margin:22px 0 16px}
.page p{font-size:clamp(12px,1.28vw,15px);line-height:2.08;letter-spacing:.025em;margin:0 0 16px}
.page .drop:first-letter{font-size:2.7em;line-height:.9;float:left;margin:7px 10px 0 0;color:#88603e}
.page .mini{font-size:12px;color:#826b4c}
.page-footer{margin-top:auto;border-top:1px solid #baa47e;padding-top:10px;display:flex;justify-content:space-between;font-size:10px;letter-spacing:.14em;color:#8c7252}
.ornament{text-align:center;font-size:30px;color:#8e7651;margin:6px}
.mini-map{width:100%;height:clamp(85px,17vh,175px);border:1px solid #bca680;margin:2px 0 16px;background:#e6d7b9}
.mini-map svg{width:100%;height:100%}
#spine{position:absolute;z-index:3;left:calc(50% - 10px);top:0;width:20px;height:100%;pointer-events:none;background:linear-gradient(90deg,transparent,#50372034 45%,#f9f0db7d 55%,transparent)}
.leaf{position:absolute;left:50%;top:0;width:50%;height:100%;transform-origin:0% 50%;transform-style:preserve-3d;will-change:transform}
.leaf-face{position:absolute;inset:0;backface-visibility:hidden;transform:translateZ(0.5px);overflow:hidden}
.leaf-back{transform:rotateY(180deg) translateZ(.5px)}
.leaf .page{height:100%}
.leaf:not(.frontmost){pointer-events:none}
.leaf.frontmost{pointer-events:auto}
#shadow{position:absolute;z-index:2;left:50%;top:0;width:50%;height:100%;pointer-events:none;background:linear-gradient(90deg,#3420134f,transparent 75%);opacity:0}
#grab{position:absolute;right:0;top:0;width:clamp(36px,6vw,75px);height:100%;z-index:40;cursor:grab;touch-action:none;opacity:0;background:linear-gradient(90deg,transparent,#9a76452c);transition:opacity .16s}
#viewport:hover #grab,#grab:focus-visible{opacity:1}
#grab:after{content:"";position:absolute;right:11px;top:46%;width:2px;height:48px;background:#95734b77}
#viewport.dragging #grab{cursor:grabbing}
#grab.left-grab{left:0;right:auto;background:linear-gradient(90deg,#9a76452c,transparent)}
#grab.left-grab:after{right:auto;left:11px}
#viewport.dragging,#viewport.dragging *{user-select:none}
.tools{display:flex;justify-content:center;align-items:center;gap:11px;flex-wrap:wrap;padding:17px 12px 12px;border-top:1px solid #ad926a5c}
.tools button,.tools select{border:1px solid #b39b78;padding:9px 13px;background:#f2e7d1;color:#624a33;font-size:12px}.tools button:disabled{opacity:.32;cursor:not-allowed}.tools output{font:12px system-ui,sans-serif;min-width:110px;text-align:center;color:#765c3d}
.about{max-width:930px;margin:0 auto;padding:12px 20px 40px;color:#7e6b52;font:12px/1.8 system-ui,sans-serif}
@media(max-width:750px){
#viewport{height:clamp(450px,67vh,570px)}
.page-inner{padding:24px 21px 19px}.page-heading{font-size:8px}.page h2{font-size:17px;margin:16px 0 10px}.page p{font-size:11px;line-height:1.72;margin-bottom:9px}.page .mini{font-size:10px}.mini-map{height:95px}.page-footer{font-size:8px}.ornament{font-size:23px}
}
@media(max-width:450px){#viewport{height:520px}.page-inner{padding:21px 14px 18px}.page h2{font-size:15px}.page p{font-size:10px;line-height:1.55}.page-heading{letter-spacing:.04em;font-size:7px}.mini-map{height:70px}.page-footer{letter-spacing:0}}
</style></head><body>
<header><span class="logo">HEXIM</span><nav class="nav"><a href="./classic.html">初期版</a><a href="./index.html">WebGL安定版</a><a href="./volume.html">質感実験</a><a href="./living-page.html">つかめる年代記</a><a href="./page-reveal.html" aria-current="page">ページの正体</a></nav></header>
<div class="intro"><div class="kicker">THE SEVENTH WORLD / THE AGE OF ASH</div><h1>第七世界の年代記</h1><p>文章を選択できる普通のWebページです。右端を左へドラッグすると、右ページだけがめくれます。</p></div>
<main id="viewport" aria-label="第七世界の年代記。右ページを左へドラッグしてめくれます">
<div id="left-base"></div><div id="right-base"></div><div id="shadow"></div><div id="leaves"></div><div id="spine"></div><div id="grab" role="button" tabindex="0" aria-label="右端をドラッグしてページをめくる"></div>
</main>
<div class="tools"><button id="prev">← 前の見開き</button><output id="status">01 / 12</output><button id="next">次の見開き →</button><label style="font:11px system-ui,sans-serif">目次 <select id="toc" aria-label="見開きを選択"></select></label><button id="save">単一HTMLを保存</button></div>
<p class="about" id="about">この見開きは、文章・リンク・地図を持つ通常のHTML文書です。中央を軸に右ページだけが左へめくれ、その紙の裏面が次の見開きの左ページになります。めくった紙は消えず左側に残ります。</p>
<script>
(()=>{
'use strict';
const $=q=>document.querySelector(q),viewport=$('#viewport'),holder=$('#leaves'),grab=$('#grab'),status=$('#status'),toc=$('#toc');
const history=[
['灰の夜明け','名もない旅人たちが荒野の果てに小さな火を灯した。まだ王国も地図もなかったが、世界はその炎から始まった。','焚火の周りに集まった人々は、次の朝も同じ場所へ戻ることを約束した。そこが最初の集落となった。'],
['最初の遠征','森の向こうに古い石造りの道が見つかった。若い探索者が危険を引き受け、誰も歩いたことのない谷へ進んだ。','一行が持ち帰ったのは金貨だけではない。街を守るための知恵と、世界を広げるための勇気だった。'],
['鍛冶場の炎','小さな鍛冶場に槌の音が響く。初めて作られた剣は粗末だったが、そこには職人の誇りが刻まれていた。','やがて工房は学校になり、若い職人たちが師の技を受け継いでいった。'],
['東の交易路','山を越える街道が拓かれ、遠い都市から旅の商人が現れた。地図に新しい線が一本引かれた。','荷車とともに運ばれた噂は、次の遠征の道しるべとなった。街は初めて外の世界と結ばれた。'],
['築かれた王国','旅人の集落は大きな城壁を持つ都市へ変わった。街の人々は広場に集まり、王国の誕生を祝った。','だが王国を築いたのは英雄の剣だけではない。道を作り、畑を耕し、次の日の火を守った人々もいた。'],
['黒い森の戦い','深い森から現れた魔物の群れが街道を閉ざした。英雄たちは互いの背中を守り、夕暮れまで戦った。','最後の一撃が終わると、戦場には奇妙な静けさが戻ってきた。'],
['継承の儀式','長く旅を続けた英雄は剣を置き、次の世代に役割を託した。名は消えても教えは残った。','若い冒険者が古い剣の柄を握ると、物語は新しい章へ進んだ。'],
['雨の年','三十日続いた雨が畑を沈め、食料を乏しくした。人々は収穫を分け合い、危機を乗り越えた。','この出来事を境に、街では毎年備蓄庫の扉を開く祭りが始まった。'],
['地下の門','地下深くに閉ざされていた門が見つかった。その向こうには、昔の世界の名残が眠っていた。','英雄たちが持ち帰った古い印章は、世界の成り立ちをめぐる新しい謎を残した。'],
['最後の遠征','最も遠い地平へ向けて一行は出発した。帰還を約束する者は誰もいなかった。','星明かりの下で交わした言葉は、やがて最後の歴史の一行になった。'],
['灰の時代','夜空が赤く染まり、遠くの山に灰が降り積もった。街の灯りは一つ、また一つと消えていった。','人々は互いの名前を呼び、最後まで記憶を手放さなかった。'],
['次の世界へ','世界は終わった。しかしそこを歩いた者たちの物語が、この紙の上に残された。','最後の頁を閉じれば、次の世界の朝が訪れる。誰かがまた、小さな火を灯すだろう。']
];
const n=history.length,angles=Array(n-1).fill(0),directions=Array(n-1).fill(1);
let current=0,goal=0,active=null,drag=null,raf=0;
const escapeHTML=value=>String(value).replace(/[&<>"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[char]));
const map=()=>'<div class="mini-map"><svg viewBox="0 0 400 200" role="img" aria-label="古地図"><g fill="none" stroke="#9b825c" stroke-width="2.5" opacity=".75"><path d="M0 55Q100 20 170 95T400 65"/><path d="M0 158Q160 104 221 142T410 112"/><path d="M70 0Q80 80 153 102T235 200" stroke-dasharray="6 8"/></g><g fill="#8c6b49"><circle cx="170" cy="95" r="10"/><path d="M263 82l22-24 22 24v38h-44z"/></g><text x="128" y="126" fill="#73593e" font-size="12">ASH VILLAGE</text></svg></div>';
const content=(i,side)=>{
 const h=history[i],left=side==='left',p=left?h[1]:h[2],number=2*i+(left?1:2);
 return '<div class="page '+side+'"><div class="page-inner"><div class="page-heading">THE SEVENTH WORLD · '+String(i+1).padStart(2,'0')+' / '+n+'</div>'+
 (left?'<h2>'+escapeHTML(h[0])+'</h2><p class="drop">'+escapeHTML(p)+'</p><p>ひとつの選択が、次の時代へ続く道となった。この記録は、その時代に生きた者のために残されている。</p><p class="mini"><a href="#about">この記録について</a></p>':
 '<div class="ornament">❦</div>'+ (i%2===0?map():'<h2>'+escapeHTML(h[0])+' — 続き</h2>')+'<p>'+escapeHTML(p)+'</p><p class="mini">忘れられた名も、その営みも、世界の歴史をかたちづくった。</p>')+
 '<div class="page-footer"><span>CHRONICLE OF HEXIM</span><span>— '+String(number).padStart(2,'0')+' —</span></div></div></div>';
};
$('#left-base').innerHTML=content(0,'left');
$('#right-base').innerHTML=content(n-1,'right');
const leaves=[];
for(let i=0;i<n-1;i++){
 const el=document.createElement('div');el.className='leaf';
 el.innerHTML='<div class="leaf-face">'+content(i,'right')+'</div><div class="leaf-face leaf-back">'+content(i+1,'left')+'</div>';
 holder.append(el);leaves.push(el);
 const opt=document.createElement('option');opt.value=String(i);opt.textContent=String(i+1).padStart(2,'0')+' · '+history[i][0];toc.append(opt);
}
{const opt=document.createElement('option');opt.value=String(n-1);opt.textContent=String(n).padStart(2,'0')+' · '+history[n-1][0];toc.append(opt)}
const render=()=>{
 leaves.forEach((leaf,i)=>{
  const angle=angles[i],turning=active?.leaf===i;
  // The same physical sheet remains at the same hinge for its entire life.
  leaf.style.transform='rotateY('+(-180*angle)+'deg)';
  leaf.style.zIndex=angle>.5?String(10+i):String(100+n-i);
  leaf.classList.toggle('frontmost',turning||i===current&&current<n-1);
  leaf.style.filter=turning?'drop-shadow(8px 8px 12px #34201640)':'none';
 });
 const moving=active?Math.sin(Math.PI*angles[active.leaf]):0;
 $('#shadow').style.opacity=String(Math.max(0,moving)*.72);
 $('#shadow').style.transform='scaleX('+(1-.55*moving)+')';
 status.textContent=String(goal+1).padStart(2,'0')+' / '+String(n).padStart(2,'0')+(current!==goal?' · 移動中':'');
 $('#prev').disabled=goal<=0;$('#next').disabled=goal>=n-1;
 toc.value=String(goal);
 grab.classList.toggle('left-grab',goal===n-1&&current===n-1);
 grab.style.display=current===n-1&&goal===n-1?'block':'block';
};
const continueTurns=()=>{
 if(active||current===goal)return;
 const dir=Math.sign(goal-current),leaf=dir>0?current:current-1;
 directions[leaf]=dir;
 const from=angles[leaf],to=dir>0?1:0;
 const duration=matchMedia('(prefers-reduced-motion: reduce)').matches?0:(Math.abs(goal-current)>1?230:430);
 const started=performance.now();active={leaf,dir};
 const tick=now=>{
  const u=duration===0?1:Math.min(1,(now-started)/duration),ease=u*u*(3-2*u);
  angles[leaf]=from+(to-from)*ease;render();
  if(u<1){raf=requestAnimationFrame(tick);return}
  angles[leaf]=to;current+=dir;active=null;render();continueTurns();
 };
 raf=requestAnimationFrame(tick);
};
const navigate=next=>{goal=Math.max(0,Math.min(n-1,next));render();continueTurns()};
const seek=next=>{
 next=Math.max(0,Math.min(n-1,next));
 if(raf)cancelAnimationFrame(raf);raf=0;active=null;drag=null;
 current=goal=next;angles.forEach((_,i)=>angles[i]=i<next?1:0);
 viewport.classList.remove('dragging');render();
};
const start=e=>{
 if(active||drag||e.button!==0||current===n-1&&goal===n-1&&false)return;
 const bounds=viewport.getBoundingClientRect();
 const left=current>0&&e.clientX<bounds.left+Math.max(38,bounds.width*.055);
 const right=current<n-1&&e.clientX>bounds.right-Math.max(38,bounds.width*.055);
 if(!left&&!right)return;
 e.preventDefault();
 const dir=right?1:-1;
 const leaf=dir>0?current:current-1;
 drag={pointerId:e.pointerId,x:e.clientX,leaf,dir,start:angles[leaf]};
 viewport.classList.add('dragging');grab.style.cursor='grabbing';render();
};
const motion=e=>{
 if(!drag||e.pointerId!==drag.pointerId)return;
 const delta=(drag.x-e.clientX)/(viewport.clientWidth*.40);
 angles[drag.leaf]=Math.max(0,Math.min(1,drag.start+delta));
 active={leaf:drag.leaf,dir:drag.dir};
 render();
};
const stop=e=>{
 if(!drag||e.pointerId!==drag.pointerId)return;
 const d=drag;drag=null;viewport.classList.remove('dragging');grab.style.cursor='';
 active=null;const fraction=angles[d.leaf];
 // Cancel returns to the original physical position, including when reversing.
 const finish=e.type==='pointercancel'?d.start:(d.dir>0?(fraction>.35?1:0):(fraction<.65?0:1));
 const endIndex=d.leaf+(finish===1?1:0);
 goal=current=endIndex; // Navigation resumes only after the current leaf settles.
 const from=fraction,startTime=performance.now(),duration=matchMedia('(prefers-reduced-motion:reduce)').matches?0:260;
 active={leaf:d.leaf,dir:d.dir};
 const tick=now=>{
  const u=duration===0?1:Math.min(1,(now-startTime)/duration),ease=u*u*(3-2*u);
  angles[d.leaf]=from+(finish-from)*ease;render();
  if(u<1){raf=requestAnimationFrame(tick);return}
  angles[d.leaf]=finish;active=null;render();
 };
 raf=requestAnimationFrame(tick);
};
viewport.addEventListener('pointerdown',start,true);
window.addEventListener('pointermove',motion,{passive:true});
window.addEventListener('pointerup',stop);
window.addEventListener('pointercancel',stop);
window.addEventListener('blur',()=>{if(drag)stop({pointerId:drag.pointerId,type:'pointercancel'})});
grab.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();navigate(current===n-1?current-1:current+1)}});
$('#prev').onclick=()=>navigate(goal-1);
$('#next').onclick=()=>navigate(goal+1);
toc.onchange=()=>seek(Number(toc.value));
document.addEventListener('keydown',e=>{if(e.target===toc)return;if(e.key==='ArrowRight')navigate(goal+1);if(e.key==='ArrowLeft')navigate(goal-1)});
$('#save').onclick=()=>{
 const url=URL.createObjectURL(new Blob(['<!doctype html>\n'+document.documentElement.outerHTML],{type:'text/html;charset=utf-8'}));
 const a=document.createElement('a');a.href=url;a.download='hexim-chronicle-24-pages.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1200);
};
render();
})();
</script></body></html>
